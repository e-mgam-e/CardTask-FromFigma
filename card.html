<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка Трекера Расходов</title>
    <link rel="stylesheet" href="assets/css/style.css"> <!-- Файл со стилями -->
</head>
<body>
    <div class="app">
        <div class="transactions-widget">
            <div class="transactions-widget__header">
                <h2 class="transactions-widget__title">Recent Transactions</h2>
                <a href="#" class="transactions-widget__link">View all</a>
            </div>
        </div>
        <div class="transactions-widget__list">
            <div class="transaction-item">
                <div class="transaction-item__icon-wrapper">
                    <img src="assets/img/icons/capOfCoffee.svg" alt="Transaction icon" class="transaction-item__icon">
                </div>
                <div class="transaction-item__info">
                    <h3 class="transaction-item__name">Starbucks Coffee</h3>
                    <div class="transaction-item__meta">
                        <span class="transaction-item__category">Food</span>
                        <span class="transaction-item__date">Today</span>
                    </div>
                </div>
                <div class="transaction-item__amount">
                        <span class="transaction-item__amount transaction-item__amount_expense">-$8.75</span>
                </div>
            </div>
            <div class="transaction-item">
                <div class="transaction-item__icon-wrapper">
                    <img src="assets/img/icons/car.svg" alt="Transaction icon" class="transaction-item__icon">
                </div>
                <div class="transaction-item__info">
                    <h3 class="transaction-item__name">Uber Ride</h3>
                    <div class="transaction-item__meta">
                        <span class="transaction-item__category">Transport</span>
                        <span class="transaction-item__date">Today</span>
                    </div>
                </div>
                <div class="transaction-item__amount">
                        <span class="transaction-item__amount transaction-item__amount_expense">-$22.5</span>
                </div>
            </div>
            <div class="transaction-item">
                <div class="transaction-item__icon-wrapper">
                    <img src="assets/img/icons/cart.svg" alt="Transaction icon" class="transaction-item__icon">
                </div>
                <div class="transaction-item__info">
                    <h3 class="transaction-item__name">Whole Foods</h3>
                    <div class="transaction-item__meta">
                        <span class="transaction-item__category">Food</span>
                        <span class="transaction-item__date">Yesterday</span>
                    </div>
                </div>
                <div class="transaction-item__amount">
                        <span class="transaction-item__amount transaction-item__amount_expense">-$156.8</span>
                </div>
            </div>
            <div class="transaction-item">
                <div class="transaction-item__icon-wrapper">
                    <img src="assets/img/icons/phone.svg" alt="Transaction icon" class="transaction-item__icon">
                </div>
                <div class="transaction-item__info">
                    <h3 class="transaction-item__name">Apple Music</h3>
                    <div class="transaction-item__meta">
                        <span class="transaction-item__category">Bills</span>
                        <span class="transaction-item__date">Yesterday</span>
                    </div>
                </div>
                <div class="transaction-item__amount">
                        <span class="transaction-item__amount transaction-item__amount_expense">-$9.99</span>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
